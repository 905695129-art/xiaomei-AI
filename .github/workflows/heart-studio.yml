name: Heart Studio checks
on:
  push:
    paths:
      - 'src/**'
      - 'db/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/heart-studio.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'db/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/heart-studio.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
