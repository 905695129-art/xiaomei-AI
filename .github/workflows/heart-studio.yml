name: Heart Studio checks
concurrency:
  group: heart-studio-v3-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    paths:
      - 'src/**'
      - 'app/**'
      - 'android/**'
      - 'db/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - 'package.json'
      - 'next.config.mjs'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.ci.yml'
      - '.dockerignore'
      - '.env.example'
      - 'tsconfig.json'
      - '.github/workflows/heart-studio.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'db/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - 'package.json'
      - 'next.config.mjs'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.ci.yml'
      - '.dockerignore'
      - '.env.example'
      - 'tsconfig.json'
      - '.github/workflows/heart-studio.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: heart
          POSTGRES_PASSWORD: heart_test_password
          POSTGRES_DB: heart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heart -d heart_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://heart:heart_test_password@localhost:5432/heart_test
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          # Ignore unrelated third-party apt feeds on hosted runners; only Ubuntu packages are needed here.
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y postgresql-client
      - name: Apply database schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Verify schema migration is repeatable
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Apply journey response migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20261128_journey_responses.sql
      - name: Verify journey response migration is repeatable
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20261128_journey_responses.sql
      - name: Apply response read-state migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20261128_journey_response_read.sql
      - name: Verify response read-state migration is repeatable
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20261128_journey_response_read.sql
      - name: Test response read-state migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20261128_journey_response_read.test.sql
      - name: Apply response message migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20261128_journey_response_message.sql
      - name: Verify response message migration is repeatable
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20261128_journey_response_message.sql
      - name: Apply sequential journey progress migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20261128_journey_level_progress.sql
      - name: Verify sequential journey progress migration is repeatable
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20261128_journey_level_progress.sql
      - name: Test sequential journey progress and visitor isolation
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20261128_journey_level_progress.test.sql
      - name: Test persisted journey response constraints
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20261128_journey_responses.test.sql
      - name: Test purchase, snapshot, duplicate-order and refund invariants
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.test.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - name: Test cover image decoding and normalization
        run: node --experimental-strip-types scripts/cover-image-test.mjs
      - name: Test fail-closed transactional email provider selection
        run: node --experimental-strip-types scripts/email-provider-test.mjs
      - run: npm run build
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-compose-validation-password
        run: docker compose config --quiet
      - name: Start production stack and run smoke test
        env:
          POSTGRES_PASSWORD: ci-compose-validation-password
        run: |
          docker compose up -d --build
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              if curl --fail --silent http://127.0.0.1:3000/api/ready >/dev/null; then
                headers="$(curl --fail --silent --show-error -D - -o /dev/null http://127.0.0.1:3000/api/health)"
                printf '%s\\n' "$headers" | grep -qiE '^x-content-type-options: *nosniff' || { echo "Missing nosniff header"; exit 1; }
                printf '%s\\n' "$headers" | grep -qiE '^x-frame-options: *DENY' || { echo "Missing frame protection header"; exit 1; }
                printf '%s\\n' "$headers" | grep -qiE '^referrer-policy: *strict-origin-when-cross-origin' || { echo "Missing referrer policy"; exit 1; }
                printf '%s\\n' "$headers" | grep -qiE '^strict-transport-security: *max-age=15552000' || { echo "Missing production HSTS header"; exit 1; }
                # Payment must remain fail-closed until a compliant provider is configured.
                payment_status="$(curl --silent --show-error --output /tmp/heart-orders-response.json --write-out '%{http_code}' --request POST http://127.0.0.1:3000/api/orders)"
                test "$payment_status" = "503" || { echo "Expected disabled payment endpoint to return HTTP 503, got $payment_status"; cat /tmp/heart-orders-response.json; exit 1; }
                grep -q '"PAYMENTS_NOT_CONFIGURED"' /tmp/heart-orders-response.json || { echo "Payment endpoint did not return the explicit disabled-provider code"; cat /tmp/heart-orders-response.json; exit 1; }
                echo "Heart Studio app, database, security headers, and disabled-payment safety gate are ready."
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Liveness probe:"
          curl --silent --show-error http://127.0.0.1:3000/api/health || true
          echo "Readiness probe:"
          curl --silent --show-error http://127.0.0.1:3000/api/ready || true
          docker compose ps
          docker compose logs --no-color app migrate db
          exit 1
      - name: Run sequential journey HTTP end-to-end test
        env:
          POSTGRES_PASSWORD: ci-compose-validation-password
        run: node scripts/journey-http-e2e.mjs
      - name: Run cover upload HTTP end-to-end test
        env:
          POSTGRES_PASSWORD: ci-compose-validation-password
        run: node scripts/cover-upload-http-e2e.mjs
      - name: Stop production stack
        if: always()
        env:
          POSTGRES_PASSWORD: ci-compose-validation-password
        run: docker compose down --volumes --remove-orphans
