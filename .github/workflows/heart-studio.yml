name: Heart Studio checks
concurrency:
  group: heart-studio-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    paths:
      - 'src/**'
      - 'db/**'
      - 'docs/**'
      - 'README.md'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/heart-studio.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'db/**'
      - 'docs/**'
      - 'README.md'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/heart-studio.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: heart
          POSTGRES_PASSWORD: heart_test_password
          POSTGRES_DB: heart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heart -d heart_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://heart:heart_test_password@localhost:5432/heart_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          # Ignore unrelated third-party apt feeds on hosted runners; only Ubuntu packages are needed here.
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y postgresql-client
      - name: Apply database schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Verify schema migration is repeatable
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Test purchase, snapshot, duplicate-order and refund invariants
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.test.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
