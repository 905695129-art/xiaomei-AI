name: Build XiaoMei AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" -type f | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          echo "ZIP contents:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Upload extracted source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: xiaomei-source-inspection
          path: extracted/xiaomei-ai/
          if-no-files-found: error


      - name: Add keyword prospecting workflow UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("extracted/xiaomei-ai/app/src/main/java/com/xiaomei/ai/MainActivity.kt")
          s=p.read_text()
          needle='        root.addView(input, ViewGroup.LayoutParams(-1, -2))'
          addition=r'''
                  val keyword = EditText(this).apply {
                      hint = "输入获客关键词，例如：情感咨询、脱单、相亲"
                      setText(getSharedPreferences("xiaomei", MODE_PRIVATE).getString("lead_keyword", "情感咨询"))
                      textSize = 14f
                  }
                  root.addView(TextView(this).apply { text = "抖音关键词获客"; textSize = 18f; setTextColor(0xFF9C4772.toInt()); setPadding(0, dp(18), 0, dp(5)) })
                  root.addView(keyword)
                  root.addView(Button(this).apply {
                      text = "打开抖音搜索关键词"
                      setOnClickListener {
                          val q = keyword.text.toString().trim()
                          if (q.isBlank()) { result.text = "请填写关键词。"; return@setOnClickListener }
                          getSharedPreferences("xiaomei", MODE_PRIVATE).edit().putString("lead_keyword", q).apply()
                          val searchUrl = "https://www.douyin.com/search/" + android.net.Uri.encode(q) + "?type=general"
                          startActivity(Intent(Intent.ACTION_VIEW, android.net.Uri.parse(searchUrl)))
                      }
                  })
                  root.addView(Button(this).apply {
                      text = "读取当前页面可见评论文字"
                      setOnClickListener {
                          val snap = getSharedPreferences("xiaomei", MODE_PRIVATE).getString("screen_snapshot", "").orEmpty()
                          if (snap.isBlank()) result.text = "未读取到页面文字。先授权小美AI屏幕辅助，再在抖音打开视频评论区。"
                          else input.setText(snap)
                      }
                  })
                  root.addView(Button(this).apply {
                      text = "AI筛选近期评论客户并生成私信草稿"
                      setOnClickListener {
                          val raw = input.text.toString().trim()
                          if (raw.isBlank()) result.text = "先读取评论页面文字或粘贴评论内容。"
                          else runAi("请分析抖音关键词“" + keyword.text.toString() + "”对应的评论文本：提取可见昵称、评论内容和明确时间；按最近1小时、24小时、3天、7天分类，时间不明确标注未知，不得猜测；识别真实需求和高/中/低意向；为高意向者生成自然、尊重边界的私信开场草稿；排除无关、广告和明确拒绝联系者。不要自动发送消息。评论文本：\\n" + raw, false)
                      }
                  })
          '''
          if needle not in s:
              raise SystemExit("MainActivity insertion point not found")
          s=s.replace(needle, needle+"\n"+addition, 1)
          p.write_text(s)
          g=Path("extracted/xiaomei-ai/app/build.gradle.kts")
          t=g.read_text().replace('versionCode = 4','versionCode = 6').replace('versionName = "0.4.0"','versionName = "0.6.0"')
          g.write_text(t)
          PY

      - name: Install redesigned prospecting assistant
        run: |
          PROJECT=extracted/xiaomei-ai
          cp app/MainActivity.new.kt "$PROJECT/app/src/main/java/com/xiaomei/ai/MainActivity.kt"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("extracted/xiaomei-ai/app/build.gradle.kts")
          s=p.read_text().replace('versionCode = 5','versionCode = 6').replace('versionName = "0.5.0"','versionName = "0.6.0"')
          p.write_text(s)
          PY

      - name: Install new sweet launcher icon
        run: bash scripts/install_launcher_icon.sh

      - name: Install floating chat assistant and optional accessibility reader
        run: |
          PROJECT="extracted/xiaomei-ai"
          SRC="$PROJECT/app/src/main/java/com/xiaomei/ai"
          RES="$PROJECT/app/src/main/res/xml"
          VALUES="$PROJECT/app/src/main/res/values"
          mkdir -p "$SRC" "$RES" "$VALUES"
          cat > "$VALUES/xiaomei_accessibility_strings.xml" <<'EOF'
          <resources><string name="xiaomei_accessibility_desc">小美 AI 聊天内容辅助服务</string></resources>
          EOF
          cat > "$SRC/OverlayService.kt" <<'EOF'
          package com.xiaomei.ai
          import android.app.Service
          import android.content.*
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.*
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.io.OutputStreamWriter
          class OverlayService : Service() {
              private var wm:WindowManager?=null
              private var bubble:TextView?=null
              private var panel:LinearLayout?=null
              private val handler=Handler(Looper.getMainLooper())
              private val modes=listOf("轻松开场","兴趣破冰","自然邀约","暖心回应","幽默接话","认真沟通")
              private fun dp(n:Int)=(n*resources.displayMetrics.density).toInt()
              private fun shape(c:Int,r:Int=18)=GradientDrawable().apply{setColor(c);cornerRadius=dp(r).toFloat()}
              override fun onBind(intent:Intent?):IBinder?=null
              override fun onCreate(){
                  super.onCreate();wm=getSystemService(WINDOW_SERVICE) as WindowManager
                  val type=if(Build.VERSION.SDK_INT>=26)WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE
                  val lp=WindowManager.LayoutParams(-2,-2,type,WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,PixelFormat.TRANSLUCENT).apply{gravity=Gravity.TOP or Gravity.END;x=dp(15);y=dp(180)}
                  bubble=TextView(this).apply{
                      text="🧸";textSize=25f;gravity=Gravity.CENTER;setTextColor(Color.WHITE)
                      setPadding(dp(11),dp(9),dp(11),dp(9));background=shape(0xFFE58AB2.toInt(),24);elevation=dp(10).toFloat()
                      setOnClickListener{toggle(lp,type)};setOnLongClickListener{stopSelf();true}
                  }
                  wm?.addView(bubble,lp)
              }
              private fun basePanel():LinearLayout=LinearLayout(this).apply{
                  orientation=1;setPadding(dp(12),dp(12),dp(12),dp(12))
                  background=GradientDrawable().apply{setColor(0xFFFFF6FA.toInt());cornerRadius=dp(23).toFloat();setStroke(dp(1),0xFFF0DCE6.toInt())}
                  elevation=dp(15).toFloat()
              }
              private fun display(view:LinearLayout,type:Int){
                  try{panel?.let{wm?.removeView(it)}}catch(_:Exception){}
                  panel=view
                  val p=WindowManager.LayoutParams(dp(300),-2,type,WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,PixelFormat.TRANSLUCENT).apply{gravity=Gravity.TOP or Gravity.END;x=dp(12);y=dp(235)}
                  try{wm?.addView(view,p)}catch(_:Exception){panel=null}
              }
              private fun toggle(anchor:WindowManager.LayoutParams,type:Int){
                  if(panel!=null){try{wm?.removeView(panel)}catch(_:Exception){};panel=null;return}
                  val menu=basePanel()
                  menu.addView(TextView(this).apply{text="选择一种聊天方式";textSize=16f;setTypeface(null,1);setTextColor(0xFF78445E.toInt());setPadding(dp(8),dp(7),dp(8),dp(10))})
                  menu.addView(TextView(this).apply{text="识别当前聊天页面内容，生成六条可复制建议";textSize=11f;setTextColor(0xFF9D8290.toInt());setPadding(dp(8),0,dp(8),dp(10))})
                  listOf("主动发起对话","识别内容后回应").forEachIndexed{section,title->
                      menu.addView(TextView(this).apply{text=title;textSize=12f;setTextColor(0xFFB66B91.toInt());setPadding(dp(8),dp(7),dp(8),dp(5))})
                      for(i in 0..2){
                          val index=section*3+i
                          menu.addView(TextView(this).apply{
                              text=listOf("🌸 轻松开场","🫧 兴趣破冰","💗 自然邀约","🌷 暖心回应","😄 幽默接话","🤍 认真沟通")[index]
                              textSize=14f;setTextColor(0xFF7E415E.toInt());setPadding(dp(14),dp(12),dp(14),dp(12));background=shape(Color.WHITE,14)
                              setOnClickListener{generate(index,type)}
                          },LinearLayout.LayoutParams(-1,-2).apply{bottomMargin=dp(6)})
                      }
                  }
                  display(menu,type)
              }
              private fun generate(mode:Int,type:Int){
                  val prefs=getSharedPreferences("xiaomei",MODE_PRIVATE)
                  val context=prefs.getString("screen_snapshot","").orEmpty()
                  val key=prefs.getString("key","").orEmpty()
                  val endpoint=prefs.getString("endpoint","https://api.openai.com/v1/chat/completions").orEmpty()
                  val model=prefs.getString("model","gpt-4o-mini").orEmpty()
                  val wait=basePanel()
                  wait.addView(TextView(this).apply{text="正在为你整理六种表达…";textSize=15f;setTextColor(0xFF78445E.toInt());setPadding(dp(12),dp(18),dp(12),dp(18))})
                  display(wait,type)
                  if(key.isBlank()){showResults(listOf("请先在小美 AI 设置中配置 AI 服务。"),type);return}
                  if(context.isBlank() && mode>=3){showResults(listOf("还没有识别到聊天文字。请先打开聊天页面，并在系统设置中允许小美读取当前屏幕文字。"),type);return}
                  Thread{
                      val result=try{
                          val guidance=listOf(
                              "根据上下文写六条自然、不冒犯的初次开场白。",
                              "围绕聊天中明确出现的兴趣，写六条分享加轻问题的破冰表达。",
                              "写六条清楚、轻松、可拒绝的邀约表达，不默认对方同意。",
                              "识别对方情绪和事实，写六条共情但不过度承诺的回应。",
                              "根据上下文写六条轻松幽默的接话，不讽刺或贬低对方。",
                              "针对对方表达，写六条真诚、清楚、有边界的回应。"
                          )[mode]
                          val prompt="你是温暖、尊重边界的中文聊天助手。"+guidance+"只返回JSON数组，恰好六个简短、可直接使用的中文句子，不要编号或解释。若聊天内容不足，给出不冒进的通用表达。不得操纵、羞辱、制造焦虑或绕过拒绝。当前页面可见文字："+context
                          val conn=URL(endpoint).openConnection() as HttpURLConnection
                          conn.requestMethod="POST";conn.connectTimeout=18000;conn.readTimeout=35000;conn.doOutput=true
                          conn.setRequestProperty("Content-Type","application/json");conn.setRequestProperty("Authorization","Bearer "+key)
                          val body=JSONObject().put("model",model).put("messages",JSONArray().put(JSONObject().put("role","user").put("content",prompt))).put("temperature",0.75)
                          OutputStreamWriter(conn.outputStream).use{it.write(body.toString())}
                          val raw=(if(conn.responseCode in 200..299)conn.inputStream else conn.errorStream).bufferedReader().use{it.readText()}
                          if(conn.responseCode !in 200..299)throw Exception("API "+conn.responseCode+": "+raw.take(250))
                          val content=JSONObject(raw).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content").trim()
                          val clean=content.removePrefix("```json").removePrefix("```").removeSuffix("```").trim()
                          val arr=JSONArray(clean);(0 until arr.length()).map{arr.optString(it)}.filter{it.isNotBlank()}.take(6)
                      }catch(e:Exception){listOf("生成失败："+(e.message?: "请检查网络和AI设置"))}
                      handler.post{showResults(result,type)}
                  }.start()
              }
              private fun showResults(items:List<String>,type:Int){
                  val panelView=basePanel()
                  panelView.addView(TextView(this).apply{text="为你准备的表达";textSize=16f;setTypeface(null,1);setTextColor(0xFF78445E.toInt());setPadding(dp(8),dp(7),dp(8),dp(10))})
                  items.forEachIndexed{index,value->
                      val row=LinearLayout(this).apply{orientation=1;setPadding(dp(11),dp(10),dp(11),dp(9));background=shape(Color.WHITE,14)}
                      row.addView(TextView(this).apply{text=(index+1).toString()+". "+value;textSize=13f;setTextColor(0xFF5F4A55.toInt())})
                      row.addView(TextView(this).apply{
                          text="复制这条表达  ⧉";textSize=11f;gravity=Gravity.END;setTextColor(0xFFD16B98.toInt());setPadding(0,dp(8),0,0)
                          setOnClickListener{
                              val cm=getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                              cm.setPrimaryClip(ClipData.newPlainText("小美聊天建议",value))
                              Toast.makeText(this@OverlayService,"已复制，可以切回聊天框粘贴",Toast.LENGTH_SHORT).show()
                          }
                      })
                      panelView.addView(row,LinearLayout.LayoutParams(-1,-2).apply{bottomMargin=dp(7)})
                  }
                  panelView.addView(TextView(this).apply{text="重新选择模式";textSize=12f;gravity=Gravity.CENTER;setTextColor(0xFFB66B91.toInt());setPadding(dp(8),dp(10),dp(8),dp(6));setOnClickListener{toggle(WindowManager.LayoutParams(),type)}})
                  display(panelView,type)
              }
              override fun onDestroy(){try{panel?.let{wm?.removeView(it)}}catch(_:Exception){};try{bubble?.let{wm?.removeView(it)}}catch(_:Exception){};panel=null;bubble=null;super.onDestroy()}
          }
          EOF
          cat > "$SRC/ChatCaptureAccessibilityService.kt" <<'EOF'
          package com.xiaomei.ai
          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.content.Context
          import android.os.SystemClock
          class ChatCaptureAccessibilityService:AccessibilityService(){
              private var last=0L
              override fun onAccessibilityEvent(event:AccessibilityEvent?){
                  if(event==null)return
                  val now=SystemClock.elapsedRealtime();if(now-last<1200)return;last=now
                  val prefs=getSharedPreferences("xiaomei",Context.MODE_PRIVATE)
                  if(!prefs.getBoolean("capture_enabled",false))return
                  if(event.packageName?.toString()==packageName)return
                  val root=rootInActiveWindow?:return
                  val parts=ArrayList<String>();collect(root,parts,0)
                  val text=parts.distinct().joinToString("\n").take(6500)
                  if(text.isNotBlank())prefs.edit().putString("screen_snapshot",text).putString("capture_package",event.packageName?.toString().orEmpty()).putLong("capture_time",System.currentTimeMillis()).apply()
              }
              private fun collect(node:AccessibilityNodeInfo,out:MutableList<String>,depth:Int){
                  if(depth>18||out.size>300)return
                  if(node.isPassword)return
                  node.text?.toString()?.trim()?.takeIf{it.length>1}?.let{out.add(it)}
                  node.contentDescription?.toString()?.trim()?.takeIf{it.length>1}?.let{out.add(it)}
                  for(i in 0 until node.childCount){val child=node.getChild(i)?:continue;collect(child,out,depth+1)}
              }
              override fun onInterrupt(){}
          }
          EOF
          cat > "$RES/xiaomei_accessibility.xml" <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowContentChanged|typeViewTextChanged|typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="500"
              android:canRetrieveWindowContent="true"
              android:description="@string/xiaomei_accessibility_desc"
              android:accessibilityFlags="flagReportViewIds" />
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          project=Path("extracted/xiaomei-ai")
          manifest=project/"app/src/main/AndroidManifest.xml"
          tree=ET.parse(manifest); root=tree.getroot()
          android="{http://schemas.android.com/apk/res/android}"
          app=root.find("application")
          if app is None: raise SystemExit("application missing")
          for name,attrs in [
              (".OverlayService",{android+"exported":"false"}),
              (".ChatCaptureAccessibilityService",{android+"permission":"android.permission.BIND_ACCESSIBILITY_SERVICE",android+"exported":"true"})
          ]:
              if not any(x.get(android+"name")==name for x in app.findall("service")):
                  el=ET.SubElement(app,"service",{android+"name":name,**attrs})
                  if name==".ChatCaptureAccessibilityService":
                      f=ET.SubElement(el,"intent-filter");ET.SubElement(f,"action",{android+"name":"android.accessibilityservice.AccessibilityService"})
                      ET.SubElement(el,"meta-data",{android+"name":"android.accessibilityservice",android+"resource":"@xml/xiaomei_accessibility"})
          tree.write(manifest,encoding="utf-8",xml_declaration=True)
          PY

      - name: Bump XiaoMei women companion version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("extracted/xiaomei-ai/app/build.gradle.kts")
          s=p.read_text().replace("versionCode = 7", "versionCode = 10").replace('versionName = "0.7.0"', 'versionName = "0.9.1"')
          p.write_text(s)
          PY

      - name: Diagnose Kotlin source
        run: |
          FILE=$(find extracted -name MainActivity.kt -type f | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: MainActivity.kt not found"
            exit 1
          fi
          echo "SOURCE_FILE=$FILE"
          nl -ba "$FILE" | sed -n '60,90p'

      - name: Patch Kotlin singleLine property
        run: |
          FILE=$(find extracted -name MainActivity.kt -type f | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: MainActivity.kt not found"
            exit 1
          fi
          sed -i 's/ singleLine = true/ isSingleLine = true/' "$FILE"
          echo "Patched EditText single-line property:"
          grep -n 'hint = hintText' "$FILE" || true
          
      - name: Find Gradle Project
        id: project
        run: |
          SETTINGS=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: ZIP does not contain settings.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaomei-ai-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
