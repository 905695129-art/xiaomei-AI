name: Build XiaoMei AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show project structure
        run: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \)

      - name: Build APK
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            gradle :app:assembleDebug
          elif [ -f "xiaomei-ai/settings.gradle.kts" ] || [ -f "xiaomei-ai/settings.gradle" ]; then
            cd xiaomei-ai
            gradle :app:assembleDebug
          else
            echo "ERROR: Cannot find Gradle project root"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaomei-ai-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            xiaomei-ai/app/build/outputs/apk/debug/app-debug.apk
