name: Build Heart Studio Android demo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'heart-studio-demo-android/**'
      - '.github/workflows/heart-studio-android-demo.yml'

permissions:
  contents: read

jobs:
  build-demo-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: heart-studio-demo-android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: heart-studio-offline-demo-apk
          path: heart-studio-demo-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
