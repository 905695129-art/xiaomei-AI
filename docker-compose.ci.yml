services:
  s3mock:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: heart-test
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    depends_on:
      s3mock:
        condition: service_healthy
    environment:
      STORAGE_ENDPOINT: http://s3mock:9090
      STORAGE_PUBLIC_URL: http://127.0.0.1:9090/heart-test
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: heart-test
      STORAGE_ACCESS_KEY: ci-access-key
      STORAGE_SECRET_KEY: ci-secret-key
