services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: heart-ci
      MINIO_ROOT_PASSWORD: heart-ci-storage-secret
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - heart_ci_storage:/data
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-02-08T19-14-21Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >
      until mc alias set local http://minio:9000 heart-ci heart-ci-storage-secret; do sleep 1; done &&
      mc mb --ignore-existing local/heart-test &&
      mc anonymous set download local/heart-test

  app:
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: http://127.0.0.1:9000/heart-test
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: heart-test
      STORAGE_ACCESS_KEY: heart-ci
      STORAGE_SECRET_KEY: heart-ci-storage-secret

volumes:
  heart_ci_storage:
